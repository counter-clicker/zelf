<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelf | Project Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --silver: linear-gradient(135deg, #f5f7fa 0%, #b8c6db 50%, #f5f7fa 100%);
        }
        body { background-color: #050505; color: #f5f5f5; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .text-silver { background: var(--silver); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .price-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid #1f1f1f;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s;
            position: relative;
            z-index: 10;
        }

        /* Verzendknop Glow */
        .btn-glow {
            box-shadow: 0 0 0 0 rgba(184, 198, 219, 0);
            animation: pulse-silver 2s infinite;
        }
        @keyframes pulse-silver {
            0% { box-shadow: 0 0 0 0 rgba(184, 198, 219, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(184, 198, 219, 0); }
            100% { box-shadow: 0 0 0 0 rgba(184, 198, 219, 0); }
        }

        .file-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hidden-section { display: none; opacity: 0; }
        
        textarea {
            background: transparent;
            border: 1px solid #1f1f1f;
            resize: none;
            transition: border-color 0.5s;
        }
        textarea:focus { border-color: #f5f7fa; outline: none; }
    </style>
</head>
<body>

    <nav class="p-8 max-w-7xl mx-auto flex justify-between items-center">
        <img src="ZELF..png" alt="Logo" class="h-6 opacity-80">
        <div class="text-[10px] uppercase tracking-[0.3em] text-gray-500">Digital Atelier</div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 relative min-h-[80vh] flex items-center justify-center">
        
        <section id="pricing-step" class="w-full">
            <h2 class="text-center text-silver text-4xl font-black italic mb-16 tracking-tighter">KIES EEN STARTPUNT</h2>
            <div id="cards-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="price-card p-10 rounded-[2rem] flex flex-col items-start" data-plan="Basic">
                    <span class="text-xs uppercase tracking-widest text-gray-500 mb-4">01. Standard</span>
                    <h3 class="text-3xl font-bold mb-6 italic">Basic</h3>
                    <button onclick="handleSelection(this)" class="mt-auto w-full py-4 border border-gray-800 rounded-xl hover:bg-white hover:text-black transition-all font-bold">Selecteer</button>
                </div>
                <div class="price-card p-10 rounded-[2rem] flex flex-col items-start border-gray-600" data-plan="Professional">
                    <span class="text-xs uppercase tracking-widest text-silver mb-4 italic">02. Most Wanted</span>
                    <h3 class="text-3xl font-bold mb-6 italic text-silver">Professional</h3>
                    <button onclick="handleSelection(this)" class="mt-auto w-full py-4 bg-white text-black rounded-xl font-bold">Selecteer</button>
                </div>
                <div class="price-card p-10 rounded-[2rem] flex flex-col items-start" data-plan="Enterprise">
                    <span class="text-xs uppercase tracking-widest text-gray-500 mb-4">03. Custom</span>
                    <h3 class="text-3xl font-bold mb-6 italic">Enterprise</h3>
                    <button onclick="handleSelection(this)" class="mt-auto w-full py-4 border border-gray-800 rounded-xl hover:bg-white hover:text-black transition-all font-bold">Selecteer</button>
                </div>
            </div>
        </section>

        <section id="briefing-step" class="hidden-section w-full max-w-4xl">
            <div class="mb-12">
                <h2 class="text-5xl font-black italic tracking-tighter text-silver mb-2">Project Briefing</h2>
                <p id="selected-label" class="text-gray-500 uppercase text-xs tracking-[0.2em] italic font-bold"></p>
            </div>

            <div class="space-y-8">
                <div class="relative">
                    <textarea id="project-desc" rows="8" class="w-full p-8 rounded-3xl text-xl placeholder:text-gray-700" placeholder="Wat is je visie? Vertel ons over je doelen, doelgroep en gewenste uitstraling..."></textarea>
                </div>

                <div class="flex flex-wrap items-center gap-4">
                    <label class="cursor-pointer flex items-center gap-3 px-6 py-3 border border-gray-800 rounded-full hover:bg-gray-900 transition group">
                        <input type="file" id="file-input" multiple class="hidden" onchange="handleFiles(this.files)">
                        <svg class="w-5 h-5 text-gray-500 group-hover:text-white transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.414a4 4 0 00-5.656-5.656l-6.415 6.414a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        <span class="text-sm font-medium">Voeg bestanden toe</span>
                    </label>
                    <div id="file-list" class="flex flex-wrap gap-2"></div>
                </div>

                <button onclick="finalSubmit()" class="btn-glow w-full md:w-auto px-12 py-5 bg-white text-black rounded-2xl font-black text-lg uppercase italic tracking-tighter hover:scale-105 transition-transform">
                    Verstuur Aanvraag →
                </button>
            </div>
        </section>
    </main>

    <script>
        let uploadedFiles = [];

        function handleSelection(btn) {
            const selectedCard = btn.parentElement;
            const allCards = document.querySelectorAll('.price-card');
            const planName = selectedCard.getAttribute('data-plan');
            
            document.getElementById('selected-label').innerText = `Geselecteerd pakket: ${planName}`;

            // 1. Fade out andere kaarten
            allCards.forEach(card => {
                if (card !== selectedCard) {
                    gsap.to(card, { opacity: 0, scale: 0.9, duration: 0.4, pointerEvents: 'none' });
                }
            });

            // 2. Animeer gekozen kaart naar het midden
            const rect = selectedCard.getBoundingClientRect();
            const centerX = window.innerWidth / 2 - rect.left - rect.width / 2;
            const centerY = window.innerHeight / 2 - rect.top - rect.height / 2;

            const tl = gsap.timeline();
            tl.to(selectedCard, {
                x: centerX,
                y: centerY,
                scale: 1.1,
                duration: 0.8,
                ease: "power4.inOut"
            })
            .to(selectedCard, {
                opacity: 0,
                scale: 1.2,
                duration: 0.5,
                delay: 0.2,
                onComplete: () => {
                    document.getElementById('pricing-step').style.display = 'none';
                    showBriefing();
                }
            });
        }

        function showBriefing() {
            const briefing = document.getElementById('briefing-step');
            briefing.style.display = 'block';
            gsap.fromTo(briefing, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1, ease: "power3.out" });
        }

        function handleFiles(files) {
            const list = document.getElementById('file-list');
            for (let file of files) {
                uploadedFiles.push(file);
                const chip = document.createElement('div');
                chip.className = 'file-chip text-silver';
                chip.innerHTML = `<span>${file.name}</span><button onclick="this.parentElement.remove()" class="hover:text-white">✕</button>`;
                list.appendChild(chip);
            }
        }

        function finalSubmit() {
            const text = document.getElementById('project-desc').value;
            if(!text) return alert("Vertel ons eerst iets over je project!");
            
            gsap.to('main', { opacity: 0, y: -50, duration: 0.8, onComplete: () => {
                document.body.innerHTML = `
                    <div class="h-screen flex flex-col items-center justify-center text-center px-6">
                        <h1 class="text-silver text-6xl font-black italic mb-4">ON THE WAY.</h1>
                        <p class="text-gray-500 max-w-sm">Je aanvraag is ontvangen. We analyseren je visie en nemen binnen 24 uur contact op.</p>
                        <button onclick="location.reload()" class="mt-8 text-xs uppercase tracking-widest border-b border-gray-800 pb-2">Terug naar home</button>
                    </div>
                `;
                gsap.from('div', { opacity: 0, duration: 1 });
            }});
        }
    </script>
</body>
</html>
